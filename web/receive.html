<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receive a File — ChromaStripe-JS</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header>
    <h1>⚡ ChromaStripe-JS / Receiver</h1>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="send.html">Send</a>
      <a href="receive.html" class="active">Receive</a>
      <a href="sim.html">Simulation</a>
    </nav>
  </header>

  <main>
    <div style="text-align:center; margin-bottom:1.5rem;">
      <button id="startCameraBtn" class="btn">📷 Open Camera & Start Scanning</button>
      <input type="file" id="videoFileInput" accept="video/*" style="display:none;">
      <button id="loadFileBtn" class="btn btn-secondary" style="display:none; margin-left:1rem;">📁 Choose Video File</button>
      <p style="color:var(--text-muted); font-size:0.85rem; margin-top:0.5rem;">Tip: Hold phone in landscape or use Rotate (90°) on sender for optimal rolling-shutter performance.</p>
    </div>

    <div id="cameraArea" style="display:none;">
      <div class="video-container">
        <video id="cameraVideo" playsinline autoplay muted></video>
        <canvas id="overlayCanvas" class="overlay-canvas"></canvas>
      </div>

      <div class="stripe-indicators">
        <div id="stripe0" class="stripe-bar" title="Stripe 0"></div>
        <div id="stripe1" class="stripe-bar" title="Stripe 1"></div>
        <div id="stripe2" class="stripe-bar" title="Stripe 2"></div>
        <div id="stripe3" class="stripe-bar" title="Stripe 3"></div>
      </div>
    </div>

    <div id="progressPanel" class="file-info" style="display:none;">
      <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
        <span>Progress: <strong id="rxBlocks">0 / 0</strong></span>
        <strong id="rxPercent">0%</strong>
      </div>
      <div style="width:100%; height:8px; background:#1e293b; border-radius:4px; overflow:hidden; margin-bottom:0.75rem;">
        <div id="progressBar" style="width:0%; height:100%; background:var(--primary); transition: width 0.2s;"></div>
      </div>
      <div style="display:flex; justify-content:space-between; color:var(--text-muted); font-size:0.85rem;">
        <span>Throughput: <strong id="rxSpeed" style="color:var(--text-main);">0.0 KB/s</strong></span>
        <span>Worker Decode: <strong id="rxDecodeMs" style="color:var(--text-main);">0.0 ms</strong></span>
      </div>
    </div>

    <div id="resultCard" class="card" style="display:none; margin-top:2rem; border-color:var(--success);">
      <div style="font-size:3rem; margin-bottom:0.5rem;">🎉</div>
      <h3 id="resName">file.bin</h3>
      <p id="resSize" style="margin-bottom:0.5rem;">0 KB</p>
      <div id="resHash" style="color:var(--success); font-weight:bold; margin-bottom:1.5rem;">✔ Verified SHA-256</div>
      <a id="downloadBtn" class="btn" style="background:var(--success);" download>Download File</a>
      <button class="btn btn-secondary" style="margin-left:1rem;" onclick="location.reload();">Scan Another</button>
    </div>
  </main>

  <script type="module" src="js/receive-app.js"></script>
</body>
</html>
